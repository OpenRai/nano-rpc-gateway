services:
  nano:
    # The published V28.2 image is a live-network build. Build the same
    # source commit with the developer network selected at image-build time;
    # using the live image here would be unsafe and would not be deterministic.
    build:
      context: https://github.com/nanocurrency/nano-node.git#0d8eea4524b8da626cbab50c286c48eae25c76a9
      dockerfile: docker/node/Dockerfile
      args:
        NANO_NETWORK: dev
    image: openrai/nano-node:V28.2-dev
    restart: unless-stopped
    volumes:
      - ./devnet/nano:/root
    ports:
      - "127.0.0.1:7076:7076"
      - "127.0.0.1:7078:7078"
    networks: [nano-private]

  gateway:
    build:
      context: .
    depends_on: [nano]
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./devnet/gateway.yaml:/etc/nano-rpc-gateway/gateway.yaml:ro
    networks: [nano-private]

networks:
  nano-private:
    # The node needs outbound connectivity to bootstrap. Native RPC and
    # WebSocket ports remain loopback-only on the host; only these two
    # development containers share the bridge network.

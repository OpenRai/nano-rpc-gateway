services:
  nano:
    # The official V28.2 image contains the pinned runtime and binaries. Select
    # the isolated developer ledger with the node's runtime --network option;
    # no local C++ build is needed.
    image: nanocurrency/nano:V28.2@sha256:ae5d9421f87c4620c2285479d95e5e79a2084878058934f7ed6a6b96b6add09e
    platform: linux/amd64
    restart: unless-stopped
    command: ["nano_node", "daemon", "--network", "dev", "-l"]
    volumes:
      - ./devnet/nano-stable:/root
      - ./devnet/nano-network:/etc/nano-network:ro
    ports:
      - "127.0.0.1:45000:45000"
      - "127.0.0.1:47000:47000"
    networks: [nano-private]

  gateway:
    build:
      context: .
    depends_on: [nano]
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./devnet/gateway.yaml:/etc/nano-rpc-gateway/gateway.yaml:ro
    networks: [nano-private]

networks:
  nano-private:
    # The node needs outbound connectivity to bootstrap. Native RPC and
    # WebSocket ports remain loopback-only on the host; only these two
    # development containers share the bridge network.
